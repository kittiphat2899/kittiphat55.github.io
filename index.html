<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITTIPAT — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mut:rgba(255,255,255,.55);--f:'Orbitron','Prompt',sans-serif;--t:'Prompt','Orbitron',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--t);overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,4vw,56px);background:linear-gradient(#000 40%,transparent)}
.logo{font:700 clamp(20px,2.6vw,34px)/1 var(--f);letter-spacing:.04em;color:#fff;text-decoration:none}
.star{position:absolute;left:50%;transform:translateX(-50%);width:34px;height:34px;opacity:.9}
nav{display:flex;gap:clamp(12px,2vw,28px);align-items:center}
nav a,.lang{font:500 clamp(13px,1.3vw,17px) var(--f);color:#fff;text-decoration:none}
nav a:hover,.lang:hover{opacity:.6}
.lang{background:none;border:1px solid var(--mut);padding:5px 9px;cursor:pointer;border-radius:3px}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
main{position:relative;z-index:1}
.hero{min-height:100svh;display:grid;grid-template-columns:1fr minmax(210px,24vw) 1fr;align-items:center;gap:clamp(12px,3vw,48px);padding:110px clamp(18px,5vw,80px) 60px;max-width:1500px;margin:auto}
.col{display:flex;flex-direction:column;gap:clamp(28px,6vh,64px)}
.col.l{align-items:flex-end;text-align:center}.col.r{align-items:flex-start;text-align:center}
.stat b{display:block;font:700 clamp(44px,7vw,96px)/1 var(--f)}
.stat span{display:block;margin-top:8px;font:500 clamp(12px,1.3vw,18px) var(--f)}
.stat{min-width:0}
.pic{justify-self:center;width:100%;aspect-ratio:760/922;position:relative}
.pic img{position:relative;width:100%;height:100%;display:block;transition:opacity .3s}
.big{font:700 clamp(38px,6.4vw,92px)/1.15 var(--f);padding:6vh clamp(18px,5vw,80px) 14vh;max-width:1500px;margin:auto}
section{padding:10vh clamp(18px,5vw,80px);max-width:1100px;margin:auto}
h2{font:700 clamp(26px,4vw,48px) var(--f);margin-bottom:28px}
p{color:var(--mut);line-height:1.9;max-width:62ch}
.list{display:grid;gap:0;border-top:1px solid rgba(255,255,255,.2)}
.list a,.list div{display:flex;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font:500 clamp(16px,2vw,22px) var(--t)}
.list small{color:var(--mut);font-size:.7em}
.tags{display:flex;flex-wrap:wrap;gap:10px}.tags span{border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:99px;font-size:15px}
.list.w a,.list.w div{flex-direction:column;gap:6px}.list.w small{font-size:15px;line-height:1.6}
.list a:hover{padding-left:12px;transition:padding .25s}
footer{position:relative;z-index:1;padding:40px clamp(18px,5vw,80px);color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:#fff}
@media(max-width:560px){
nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:9px 16px;gap:14px;white-space:nowrap}
nav a{font-size:13px}.lang{font-size:12px;padding:4px 8px}
body{padding-bottom:84px}
}
@media(max-width:820px){
.star{display:none}
.hero{grid-template-columns:1fr 1fr;padding-top:70px;padding-bottom:30px}
.pic{grid-column:1/-1;grid-row:1;max-width:240px;margin-top:70px}
.col{display:contents}
.col.l,.col.r{align-items:center}
.stat{text-align:center;padding:10px 0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,s=el.dataset.s;let t0;

 requestAnimationFrame(step)});


// particles
const c=document.getElementById('fx'),x=c.getContext('2d');
let W,H,P=[],m={x:-999,y:-999},dpr=Math.min(devicePixelRatio||1,2);
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function init(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 const n=Math.min(110,Math.floor(W*H/12000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4}))}
function draw(){x.clearRect(0,0,W,H);
 for(const p of P){
  const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
  if(d<120){p.x+=dx/d*(120-d)*.03;p.y+=dy/d*(120-d)*.03}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
 for(let i=0;i<P.length;i++){const a=P[i];
  x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill();
  for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
   if(d<110){x.strokeStyle='rgba(255,255,255,'+(.14*(1-d/110))+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
 if(!still)requestAnimationFrame(draw)}
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener('pointerleave',()=>{m.x=m.y=-999});
addEventListener('resize',init);
init();draw();
